# LoloShop — nginx site config
# Install: copy to /etc/nginx/sites-available/lolo-shop96.com
#          ln -s /etc/nginx/sites-available/lolo-shop96.com /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# Then run: certbot --nginx -d lolo-shop96.com -d www.lolo-shop96.com
#          (certbot auto-adds the :443 server block + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name lolo-shop96.com www.lolo-shop96.com;

    # Images up to 10MB (designer logo/image uploads)
    client_max_body_size 15m;

    # Compress text responses (API JSON, JS, CSS).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # After enabling TLS (certbot), uncomment to enforce HTTPS for a year:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Express API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ZKTeco ADMS firmware posts directly to /iclock/*, outside the public API
    # prefix. Route it to Express before the Next.js catch-all handles it.
    location /iclock/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (served by Express static at /uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
