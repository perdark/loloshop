# LoloShop — nginx site config
# Install: copy to /etc/nginx/sites-available/loloshop96.com
#          ln -s /etc/nginx/sites-available/loloshop96.com /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# Then run: certbot --nginx -d loloshop96.com -d www.loloshop96.com
#          (certbot auto-adds the :443 server block + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name loloshop96.com www.loloshop96.com;

    # Images up to 10MB (designer logo/image uploads)
    client_max_body_size 15m;

    # Express API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (served by Express static at /uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
