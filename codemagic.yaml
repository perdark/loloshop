# Codemagic CI/CD — builds and ships the LoloShop iOS app (لولو شوب) to the
# App Store WITHOUT needing a Mac locally. The build runs on Codemagic's macOS
# machines.
#
# The Capacitor project lives in ./frontend (appId com.loloshop96.app). This
# file stays at the REPOSITORY ROOT (Codemagic requires that); the
# `working_directory: frontend` key below routes every build command into the
# app folder — which also fixes the "repository doesn't contain a mobile
# application" scan error for monorepos.
#
# The iOS native project is generated fresh on the build machine each run, so
# there is no ios/ folder to commit from Linux.
#
# BEFORE THE FIRST BUILD: configure the App Store Connect integration in the
# Codemagic UI (Teams → Integrations → Apple → connect your API key, name it
# exactly "revoart_asc").

workflows:
  ios-appstore:
    name: LoloShop iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend      # <- app lives here; all scripts run from here

    integrations:
      # Must match the name you give the App Store Connect API key in the Codemagic UI.
      # This key is account-wide (RevoArt) — reuse it for every future app too.
      app_store_connect: revoart_asc

    environment:
      ios_signing:
        distribution_type: app_store          # Codemagic auto-creates the cert + profile
        bundle_identifier: com.loloshop96.app
      vars:
        # Numeric Apple ID of the app record (NOT the bundle id). Used to auto-bump builds.
        APP_STORE_APPLE_ID: 6793976053
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22          # Capacitor 8 CLI needs Node >= 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          # npm install (not ci) so the newly added @capacitor/ios reconciles the lockfile
          npm install

      - name: Generate + sync the iOS native project
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Apply App Store signing profiles to the Xcode project
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Auto-increment the build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($LATEST + 1))

      - name: Build the signed .ipa
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # First runs land in TestFlight only. Flip submit_to_app_store to true
        # once you're ready to actually submit for App Store review.
        submit_to_testflight: true
        submit_to_app_store: false
