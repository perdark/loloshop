# LoloShop — production nginx (HTTP redirect + HTTPS)
# Cert must exist: /etc/letsencrypt/live/lolo-shop96.com/
#
#   sudo cp /var/www/loloshop/nginx-ssl.conf /etc/nginx/sites-available/lolo-shop96.com
#   sudo ln -sf /etc/nginx/sites-available/lolo-shop96.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/lolo_shop96.com
#   sudo nginx -t && sudo systemctl reload nginx

# Do not log query strings (TV/SSE keys) or secret portal paths.
map $uri $loloshop_safe_uri {
    default $uri;
    ~^/(s|w|d|tv)/ /private-portal/[redacted];
}
log_format loloshop_safe '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $loloshop_safe_uri $server_protocol" $status $body_bytes_sent '
                         '"-" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name lolo-shop96.com www.lolo-shop96.com;
    access_log /var/log/nginx/loloshop.access.log loloshop_safe;
    server_tokens off;
    return 301 https://lolo-shop96.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lolo-shop96.com www.lolo-shop96.com;
    access_log /var/log/nginx/loloshop.access.log loloshop_safe;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/lolo-shop96.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lolo-shop96.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Served straight off disk by nginx. Until 2026-08-15 this proxied to Express on
    # :4000, which meant 5.0 GB across 7,178 files — every student photo, university
    # logo, calligraphy plate and catalog shot — travelled through the SAME
    # single-threaded Node event loop that serves OTP, login and order creation. Under a
    # cohort-sized intake that is the loop's biggest competitor, and it is competing to
    # do something nginx does for free with sendfile().
    #
    # This gives up NO access control: backend/server.js served these with a bare
    # `express.static` and no auth guard, so an upload URL was already readable by
    # anyone holding it. Keeping Node in the path protected nothing — it only slowed
    # every image down.
    #
    # The three headers below replicate backend/server.js:64-75 byte for byte, so the
    # response a browser sees is unchanged. In particular `no-store` is kept
    # deliberately: customer artwork must not linger in a shared browser or
    # service-worker cache after logout. Letting browsers cache these is a real
    # performance win and a real privacy trade-off — it is an owner decision, not a
    # side effect of this change.
    location /uploads/ {
        alias /var/www/loloshop/uploads/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
