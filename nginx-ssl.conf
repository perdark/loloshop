# LoloShop — production nginx (HTTP redirect + HTTPS)
# Cert must exist: /etc/letsencrypt/live/lolo-shop96.com/
#
#   sudo cp /var/www/loloshop/nginx-ssl.conf /etc/nginx/sites-available/lolo-shop96.com
#   sudo ln -sf /etc/nginx/sites-available/lolo-shop96.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/loloshop96.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lolo-shop96.com www.lolo-shop96.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lolo-shop96.com www.lolo-shop96.com;

    ssl_certificate /etc/letsencrypt/live/lolo-shop96.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lolo-shop96.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
