<!-- iPhone 17 Pro Max — paste inside the composition. Set --dw to the SCREEN width
     in px; everything else derives from it. Swap dev-ti for dev-orange / dev-blue.
     Put the app screenshots (700px-wide jpgs from ../shared/app/) inside .d-app —
     they are 440x894 pt captures, so they sit BELOW the drawn status bar exactly
     as they do on a real device. -->
<div class="device dev-ti" id="dev" style="--dw:470px">
  <div class="d-frame">
    <div class="d-screen">
      <div class="d-app" id="devApp">
        <!-- <img id="scrHome" src="../shared/app/home.jpg" alt=""> ... -->
      </div>
      <div class="d-status">
        <span class="d-time">٩:٤١</span>
        <span class="d-sig">
          <svg width="19" height="13" viewBox="0 0 19 13"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6.4" width="3" height="6.6" rx="1"/><rect x="10" y="3.4" width="3" height="9.6" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></svg>
          <svg width="17" height="13" viewBox="0 0 17 13"><path d="M8.5 12.4 6.2 9.9a3.3 3.3 0 0 1 4.6 0zM3.6 7.3 1.9 5.5a9.6 9.6 0 0 1 13.2 0l-1.7 1.8a7.2 7.2 0 0 0-9.8 0zm2.1 2.2L4 7.7a6 6 0 0 1 9 0l-1.7 1.8a3.7 3.7 0 0 0-5.6 0z"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.6" y="0.6" width="21" height="11.8" rx="3.4" fill="none" stroke="currentColor" stroke-opacity=".38" stroke-width="1.2"/><rect x="2.3" y="2.3" width="15.6" height="8.4" rx="2.2"/><path d="M23.2 4.3c1.4.5 1.4 3.9 0 4.4z"/></svg>
        </span>
      </div>
      <div class="d-island"><i class="d-lens"></i></div>
      <div class="d-home"></div>
      <div class="d-gloss" id="devGloss"></div>
    </div>
  </div>
  <i class="d-btn d-act"></i><i class="d-btn d-vup"></i><i class="d-btn d-vdn"></i>
  <i class="d-btn d-pwr"></i><i class="d-btn d-cam"></i>
</div>
